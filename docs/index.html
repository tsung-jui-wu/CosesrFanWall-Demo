<!doctype html>
<html data-static lang="en" class="i18n-pending">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="demo.hub.title"></title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="landing">
  <main>
    <header class="topbar">
      <span class="wordmark">FanWall</span>
      <div class="topbar-end">
        <span class="chip" data-i18n="demo.banner"></span>
        <div class="lang-switch" data-lang-switch></div>
      </div>
    </header>
    <section class="spotlight" aria-labelledby="hero-h">
      <h1 id="hero-h">FanWall</h1>
      <p class="lead" data-i18n="demo.hub.lead"></p>
    </section>
    <section class="panel" aria-labelledby="rev-h">
      <h2 id="rev-h" data-i18n="demo.hub.revealHeading"></h2>
      <p class="muted" data-i18n="demo.hub.revealText"></p>
      <ul class="demo-links">
        <li><a href="r/yuki/">Yuki</a><span data-i18n="demo.case.yuki"></span><span class="demo-styles"><a href="r/yuki/" data-i18n="style.mosaic.name"></a> · <a href="r/yuki-polaroid/" data-i18n="style.polaroid.name"></a> · <a href="r/yuki-constellation/" data-i18n="style.constellation.name"></a></span></li>
        <li><a href="r/aki/">Aki</a><span data-i18n="demo.case.aki"></span><span class="demo-styles"><a href="r/aki/" data-i18n="style.mosaic.name"></a> · <a href="r/aki-polaroid/" data-i18n="style.polaroid.name"></a> · <a href="r/aki-constellation/" data-i18n="style.constellation.name"></a></span></li>
        <li><a href="r/mei/">Mei</a><span data-i18n="demo.case.mei"></span><span class="demo-styles"><a href="r/mei/" data-i18n="style.mosaic.name"></a> · <a href="r/mei-polaroid/" data-i18n="style.polaroid.name"></a> · <a href="r/mei-constellation/" data-i18n="style.constellation.name"></a></span></li>
        <li><a href="r/rin/">Rin</a><span data-i18n="demo.case.rin"></span><span class="demo-styles"><a href="r/rin/" data-i18n="style.mosaic.name"></a> · <a href="r/rin-polaroid/" data-i18n="style.polaroid.name"></a> · <a href="r/rin-constellation/" data-i18n="style.constellation.name"></a></span></li>
        <li><a href="r/sora/">Sora</a><span data-i18n="demo.case.sora"></span><span class="demo-styles"><a href="r/sora/" data-i18n="style.mosaic.name"></a> · <a href="r/sora-polaroid/" data-i18n="style.polaroid.name"></a> · <a href="r/sora-constellation/" data-i18n="style.constellation.name"></a></span></li>
        <li><a href="r/kai/">Kai</a><span data-i18n="demo.case.kai"></span></li>
      </ul>
    </section>
    <section class="panel" aria-labelledby="fan-h">
      <h2 id="fan-h" data-i18n="demo.hub.fanHeading"></h2>
      <p class="muted" data-i18n="demo.hub.fanText"></p>
      <ul class="demo-links"><li><a href="e/demo/c/aki/" data-i18n="fan.titleFor" data-i18n-vars="{&quot;name&quot;:&quot;Aki&quot;}"></a></li></ul>
    </section>
    <section class="panel" aria-labelledby="org-h">
      <h2 id="org-h" data-i18n="demo.hub.orgHeading"></h2>
      <p class="muted" data-i18n="demo.hub.orgText"></p>
      <ul class="demo-links"><li><a href="admin/demo/" data-i18n="admin.heading"></a></li></ul>
    </section>
    <section class="panel" aria-labelledby="yir-h">
      <h2 id="yir-h" data-i18n="review.title"></h2>
      <p class="muted" data-i18n="demo.hub.reviewText"></p>
      <ul class="demo-links"><li><a href="review/" data-i18n="review.title"></a></li></ul>
    </section>
  </main>
  <script type="module" src="js/i18n.js"></script>
</body>
</html>
