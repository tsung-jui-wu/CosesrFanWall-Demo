<!doctype html>
<html data-static lang="en" class="i18n-pending" data-lang-scope="print">
<head>
  <meta charset="utf-8">
  <base href="../../../../">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title data-i18n="print.docTitle"></title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <p class="demo-banner"><span data-i18n="demo.banner"></span> · <a href="" data-i18n="demo.allPages"></a></p>
  <div class="print-bar row">
    <button type="button" class="primary" id="print" data-i18n="print.print"></button>
    <!-- The sign's own language, remembered apart from the dashboard's: it's for the people who scan it. -->
    <div class="lang-switch" data-lang-switch data-lang-label="print.lang"></div>
  </div>
  <main class="plain">
  <article class="sign" id="sign" hidden>
    <p class="event" id="event-name"></p>
    <h1 id="cos-name"></h1>
    <p class="character" id="cos-character"></p>
    <img class="qr" id="qr" alt="">
    <p class="cta" id="cta"></p>
    <p class="fine" data-i18n="print.fine"></p>
  </article>
  </main>
  <!-- The site owner's contact, for invite codes and questions. Plain links: nothing loads from these sites. -->
  <footer class="site-footer">
    <p data-i18n="landing.contact.lead"></p>
    <p class="contact-links">
      <a href="mailto:contact@ruiruiworld.com"><span class="muted" data-i18n="landing.contact.email"></span> contact@ruiruiworld.com</a>
      <a href="https://www.instagram.com/ruirui.1208/" target="_blank" rel="noopener noreferrer"><span class="visually-hidden" data-i18n="landing.contact.instagram"></span><svg class="contact-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true" focusable="false"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.3" cy="6.7" r="0.6" fill="currentColor" stroke="none"/></svg>@ruirui.1208</a>
    </p>
  </footer>
  <div id="status" role="status" aria-live="polite"></div>
  <script type="module" src="js/print.js"></script>
</body>
</html>
