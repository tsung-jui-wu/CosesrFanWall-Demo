<!doctype html>
<html data-static lang="en" class="i18n-pending">
<head>
  <meta charset="utf-8">
  <base href="../../">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title data-i18n="admin.docTitle"></title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <p class="demo-banner"><span data-i18n="demo.banner"></span> · <a href="" data-i18n="demo.allPages"></a></p>
  <main>
    <header class="topbar">
      <span class="wordmark">FanWall<span class="muted" data-i18n="admin.wordmark"></span></span>
      <div class="topbar-end">
        <div class="lang-switch" data-lang-switch></div>
        <button type="button" id="refresh" data-i18n="admin.refresh"></button>
      </div>
    </header>

    <section id="admin-error" class="panel" hidden>
      <h2 data-i18n="admin.invalid.title"></h2>
      <p class="muted" data-i18n="admin.invalid.text"></p>
    </section>

    <div id="dash-body">
    <div class="notice" id="new-notice" hidden>
      <strong data-i18n="admin.bookmark.title"></strong> <span data-i18n="admin.bookmark.text"></span>
    </div>

    <!-- Home: the event, its numbers, and three tabs. Counts live on these pages only: fan and
         cosplayer pages never show numbers. -->
    <div id="view-home">
      <div class="dash-head">
        <div>
          <p class="state" id="event-state"></p>
          <h1 id="event-title" data-i18n="admin.heading"></h1>
        </div>
        <button type="button" class="primary" id="release-all" hidden data-i18n="admin.releaseAll.label"></button>
      </div>

      <section class="stats" aria-label="" data-i18n-aria-label="admin.stats.label">
        <div class="stat spotlight"><span class="label" data-i18n="admin.stats.pending"></span><span class="num" id="stat-pending">0</span><span class="sub" data-i18n="admin.stats.pendingSub"></span></div>
        <div class="stat"><span class="label" data-i18n="admin.stats.approved"></span><span class="num" id="stat-approved">0</span><span class="sub" data-i18n="admin.stats.approvedSub"></span></div>
        <div class="stat"><span class="label" data-i18n="admin.stats.cosplayers"></span><span class="num" id="stat-cosplayers">0</span><span class="sub" id="stat-released"></span></div>
        <div class="stat"><span class="label" data-i18n="admin.stats.keptFor"></span><span class="num"><span id="stat-days">30</span><small id="stat-days-unit"></small></span><span class="sub" data-i18n="admin.stats.keptForSub"></span></div>
      </section>

      <div class="tabs" role="tablist" aria-label="" data-i18n-aria-label="admin.tabs.label" id="home-tabs">
        <a role="tab" id="tab-cosplayers" data-tab="cosplayers" aria-controls="panel-cosplayers"><span data-i18n="admin.cos.heading"></span></a>
        <a role="tab" id="tab-review" data-tab="review" aria-controls="panel-review"><span data-i18n="admin.review.heading"></span><span class="tab-n" id="tab-review-n"></span></a>
        <a role="tab" id="tab-settings" data-tab="settings" aria-controls="panel-settings"><span data-i18n="admin.tab.settings"></span></a>
      </div>

      <section role="tabpanel" id="panel-cosplayers" aria-labelledby="tab-cosplayers">
        <h2 class="visually-hidden" data-i18n="admin.cos.heading"></h2>
        <div id="folders" class="folders"></div>
      </section>

      <section role="tabpanel" id="panel-review" aria-labelledby="tab-review" hidden></section>

      <section role="tabpanel" id="panel-settings" aria-labelledby="tab-settings" hidden>
        <div class="settings-cards">
          <section class="panel" aria-labelledby="settings-h">
            <h2 id="settings-h" data-i18n="admin.settings.heading"></h2>
            <form id="settings">
              <div class="field">
                <label for="ev-name" data-i18n="admin.settings.name"></label>
                <input id="ev-name" type="text" maxlength="80" required autocomplete="off">
              </div>
              <div class="field">
                <label for="ev-retention" data-i18n="admin.settings.retention"></label>
                <input id="ev-retention" type="number" min="1" max="90" required>
                <p class="small muted" data-i18n="admin.settings.retentionNote"></p>
              </div>
              <div class="field">
                <label for="ev-lang" data-i18n="admin.settings.lang"></label>
                <select id="ev-lang">
                  <option value="" data-i18n="admin.settings.langNone"></option>
                  <option value="en" lang="en">English</option>
                  <option value="zh-Hans" lang="zh-Hans">简体中文</option>
                  <option value="zh-Hant" lang="zh-Hant">繁體中文</option>
                </select>
                <p class="small muted" data-i18n="admin.settings.langNote"></p>
              </div>
              <div class="field">
                <label for="ev-style" data-i18n="admin.settings.style"></label>
                <select id="ev-style">
                  <option value="mosaic" data-i18n="style.mosaic.name"></option>
                  <option value="polaroid" data-i18n="style.polaroid.name"></option>
                  <option value="constellation" data-i18n="style.constellation.name"></option>
                </select>
                <p class="small" id="ev-style-about"></p>
                <p class="small muted" data-i18n="admin.settings.styleNote"></p>
              </div>
              <div class="field">
                <label class="check"><input id="ev-open" type="checkbox"> <span data-i18n="admin.settings.open"></span></label>
                <p class="small muted" data-i18n="admin.settings.openNote"></p>
              </div>
              <button class="primary" type="submit" data-i18n="admin.settings.save"></button>
            </form>
          </section>

          <section class="panel" aria-labelledby="base-h">
            <h2 id="base-h" data-i18n="admin.base.heading"></h2>
            <img id="base-preview" class="base-preview" alt="" data-i18n-alt="admin.base.previewAlt" hidden>
            <p class="muted" data-i18n="admin.base.text"></p>
            <form id="base-form" class="row">
              <label for="base-file" class="visually-hidden" data-i18n="admin.base.choose"></label>
              <input id="base-file" type="file" accept="image/*" required>
              <button type="submit" data-i18n="admin.base.upload"></button>
            </form>
          </section>
        </div>
      </section>
    </div>

    <!-- One cosplayer's page: their image on top, then their review queue and their links. -->
    <div id="view-cosplayer" hidden>
      <a class="back" id="back" data-i18n="admin.back"></a>
      <header class="cos-hero">
        <div class="cos-banner" id="cos-banner"></div>
        <div class="cos-hero-body">
          <div>
            <h1 id="cos-title"></h1>
            <p class="muted" id="cos-subtitle"></p>
          </div>
          <span class="badge" id="cos-badge"></span>
        </div>
        <div class="row cos-image-row" id="cos-image-row"></div>
      </header>

      <div class="tabs" role="tablist" aria-label="" data-i18n-aria-label="admin.cosTabs.label" id="cos-tabs">
        <a role="tab" id="tab-c-review" data-tab="review" aria-controls="panel-c-review"><span data-i18n="admin.review.heading"></span><span class="tab-n" id="tab-c-review-n"></span></a>
        <a role="tab" id="tab-c-share" data-tab="share" aria-controls="panel-c-share"><span data-i18n="admin.cosTab.share"></span></a>
      </div>
      <section role="tabpanel" id="panel-c-review" aria-labelledby="tab-c-review"></section>
      <section role="tabpanel" id="panel-c-share" aria-labelledby="tab-c-share" hidden>
        <div class="share-cards" id="share-cards"></div>
      </section>
    </div>

    <!-- The review queue: shown in the home Review tab (every cosplayer) or on a cosplayer's page (theirs). -->
    <section id="review" aria-labelledby="mod-h">
      <div class="spread">
        <h2 id="mod-h" class="visually-hidden" data-i18n="admin.review.heading"></h2>
        <div id="f-cos" class="pills" role="group" aria-label="" data-i18n-aria-label="admin.filter.byCosplayer"></div>
        <div class="row">
          <label for="f-status" class="visually-hidden" data-i18n="admin.filter.status"></label>
          <select id="f-status">
            <option value="pending" data-i18n="admin.filter.pending"></option>
            <option value="approved" data-i18n="admin.filter.approved"></option>
            <option value="rejected" data-i18n="admin.filter.rejected"></option>
            <option value="all" data-i18n="admin.filter.all"></option>
          </select>
          <button type="button" id="bulk-approve" data-i18n="admin.bulk.label"></button>
        </div>
      </div>
      <div id="grid" class="grid" aria-label="" data-i18n-aria-label="admin.grid.label"></div>
      <p class="small muted keys" id="keys-hint"></p>
    </section>
    </div>
  </main>
  <div id="status" role="status" aria-live="polite"></div>
  <script type="module" src="js/admin.js"></script>
</body>
</html>
