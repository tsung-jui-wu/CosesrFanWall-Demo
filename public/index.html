<!doctype html>
<html lang="en" class="i18n-pending">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>FanWall</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="landing">
  <main>
    <header class="topbar">
      <span class="wordmark">FanWall</span>
      <div class="lang-switch" data-lang-switch></div>
    </header>
    <section class="spotlight" aria-labelledby="hero-h">
      <h1 id="hero-h">FanWall</h1>
      <p class="lead" data-i18n="landing.lead"></p>
    </section>

    <section class="panel" aria-labelledby="create-h">
      <h2 id="create-h" data-i18n="landing.create.heading"></h2>
      <form id="create">
        <div class="field">
          <label for="name" data-i18n="landing.create.name"></label>
          <input id="name" name="name" type="text" maxlength="80" required autocomplete="off">
        </div>
        <div class="field">
          <label for="retention" data-i18n="admin.settings.retention"></label>
          <input id="retention" name="retentionDays" type="number" min="1" max="90" value="30" required>
          <p class="small muted" data-i18n="admin.settings.retentionNote"></p>
        </div>
        <div class="field" id="key-field" hidden>
          <label for="key" data-i18n="landing.create.key"></label>
          <input id="key" name="key" type="password" autocomplete="off">
          <p class="small muted" data-i18n="landing.create.keyNote"></p>
        </div>
        <button class="primary" type="submit" data-i18n="landing.create.submit"></button>
      </form>
    </section>
  </main>
  <div id="status" role="status" aria-live="polite"></div>
  <script type="module" src="/js/landing.js"></script>
</body>
</html>
